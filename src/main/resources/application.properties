#For Railway Deployment
spring.application.name=studCRUD

# Database Configuration (Using Railway Variables)
# Syntax: ${VARIABLE_NAME:default_value}
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:studcrud}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:0814}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Updated dialect for modern Spring Boot versions
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Critical for Railway Deployment
# Railway assigns a random port to the ${PORT} variable
server.port=${PORT:8080}
server.address=0.0.0.0
